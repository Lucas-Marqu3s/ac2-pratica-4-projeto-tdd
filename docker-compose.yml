services:
  # Aplicação TDD Projeto
  tdd-projeto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdd-projeto-app
    image: lucasmarqu3s/tdd-projeto:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s